base_config:
  data_root: severstal-steel-defect-detection
  train_csv: train.csv
  image_dir: train_images
  splits_dir: data/processed/splits
  seed: 42
  splits:
    train: 0.7
    val: 0.15
    test: 0.15
  loader:
    batch_size: 4
    num_workers: 0
    pin_memory: false
  patch:
    height: 256
    width: 512
    stride_height: 256
    stride_width: 512
  training:
    epochs: 30
    learning_rate: 0.0003
    weight_decay: 1.0e-05
    patience: 6
    threshold: 0.5
experiment: E1 BCE plus 1.0 Soft Dice
loss_difference_from_E0: BCEWithLogitsLoss + 1.0 * SoftDiceLoss
dice_absent_class_rule: Exclude classes without a positive target pixel in the current
  batch; all-empty batch Dice loss is zero
early_stopping_monitor_for_formal_training: full validation BCE, patience 6
pilot_epochs: 2
pilot_id_source: reports/pilot
